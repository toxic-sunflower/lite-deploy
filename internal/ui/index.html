<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lite-deploy</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6a6a6a; --line:#e6e6e6; --card:#fafaf9; --ok:#0b6b57; --bad:#b3261e; --btn:#1a1a1a; --btnfg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131313; --fg:#e6e6e3; --muted:#9a9a95; --line:#2a2a28; --card:#1a1a19; --ok:#5cc8a6; --bad:#f2837b; --btn:#e6e6e3; --btnfg:#131313; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 20px; }
  h1 { font: 600 18px ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; }
  .srv { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--muted); font-size:14px; margin-bottom:12px; }
  table { border-collapse:collapse; width:100%; font-size:14px; margin-bottom:12px; }
  th,td { text-align:left; padding:6px 10px 6px 0; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  code { font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .up { color:var(--ok); } .down { color:var(--bad); }
  .act { font-weight:600; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0; }
  input[type=text] { flex:1 1 280px; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  button:disabled { opacity:.5; cursor:default; }
  .hist { color:var(--muted); font-size:13px; margin-top:10px; }
  .hist div { padding:1px 0; }
  #msg { position:sticky; top:0; margin-bottom:12px; padding:10px 14px; border-radius:6px; font-size:14px; white-space:pre-wrap; display:none; }
  #msg.ok { display:block; border:1px solid var(--ok); color:var(--ok); background:var(--bg); }
  #msg.err { display:block; border:1px solid var(--bad); color:var(--bad); background:var(--bg); }
  .empty { color:var(--muted); }
  h3 { font-size:15px; margin:24px 0 8px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.04em; }
  input.num { flex:0 0 90px; } input.src { flex:1 1 180px; }
  select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .tag { color:var(--muted); font-size:12px; }
  pre.out { margin:8px 0 0; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; max-height:260px; overflow:auto; }
  .warn { color:#9a6700; } @media (prefers-color-scheme: dark) { .warn { color:#e3b341; } }
  .cmd { margin:8px 0 0; }
  .cmd .help { color:var(--muted); font-size:13px; }
  .np label { display:block; font-size:13px; color:var(--muted); margin:10px 0 2px; }
  .np input[type=text], .np textarea, .np select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .np textarea { min-height:70px; resize:vertical; }
  .np .box { border:1px solid var(--line); border-radius:6px; padding:8px 12px 12px; margin:10px 0; }
  .np .row { display:flex; gap:8px; flex-wrap:wrap; } .np .row > div { flex:1 1 200px; }
  .np .inline { display:flex; gap:8px; align-items:center; margin:10px 0 2px; font-size:14px; color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>lite-deploy</h1><span class="srv" id="srv"></span></header>
  <div id="msg"></div>
  <div id="list"><p class="empty">Loading…</p></div>
  <h3>New project</h3>
  <div id="np"></div>
  <h3>Firewall</h3>
  <div id="fw"><p class="empty">Loading…</p></div>
  <h3>Server check</h3>
  <div id="vf"><button id="vfgo" class="primary">Check</button><div id="vfout"></div></div>
  <h3>Packages and plugins</h3>
  <div id="pl"><p class="empty">Loading…</p></div>
</div>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || sessionStorage.getItem('t') || '';
  if (token) { sessionStorage.setItem('t', token); history.replaceState(null, '', location.pathname); }
  var busy = false;

  function api(path, body) {
    var opt = { headers: { 'X-Token': token } };
    if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) { return r.json(); });
  }
  function msg(kind, text) { var m = document.getElementById('msg'); m.className = kind; m.textContent = text; }
  function clearMsg() { document.getElementById('msg').className = ''; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function short(s) { return s && s.length > 12 ? s.slice(0, 12) : (s || ''); }

  function card(p) {
    var c = el('div', 'card');
    c.appendChild(el('h2', null, p.project));
    var active = p.active === 'none' ? 'not deployed yet' : 'active slot: ' + p.active;
    c.appendChild(el('div', 'meta', active));
    var t = el('table'), h = el('tr');
    ['Slot', 'Service', 'Port', 'State'].forEach(function (x) { h.appendChild(el('th', null, x)); });
    t.appendChild(h);
    ['blue', 'green'].forEach(function (slot) {
      Object.keys(p.slots[slot] || {}).sort().forEach(function (svc) {
        var s = p.slots[slot][svc], r = el('tr');
        r.appendChild(el('td', slot === p.active ? 'act' : null, slot + (slot === p.active ? ' (active)' : '')));
        r.appendChild(el('td', null, svc));
        r.appendChild(el('td', null, String(s.port)));
        r.appendChild(el('td', s.up ? 'up' : 'down', s.up ? 'running' + (s.version ? ', version ' + short(s.version) : '') : 'not responding'));
        t.appendChild(r);
      });
    });
    c.appendChild(t);

    var f = el('form'), inp = el('input'), go = el('button', 'primary', 'Deploy'), rb = el('button', null, 'Roll back');
    inp.type = 'text'; inp.placeholder = 'commit hash (40 characters)'; inp.maxLength = 40; inp.spellcheck = false; inp.autocomplete = 'off';
    go.type = 'submit'; rb.type = 'button';
    f.appendChild(inp); f.appendChild(go); f.appendChild(rb);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var sha = inp.value.trim().toLowerCase();
      if (!/^[0-9a-f]{40}$/.test(sha)) { msg('err', 'The full commit hash is required: 40 characters 0-9a-f.'); return; }
      if (!confirm('Deploy ' + sha.slice(0, 12) + ' to project ' + p.project + '?')) return;
      run('Deploying, this may take a few minutes…', '/api/deploy', { project: p.project, sha: sha }, function (d) {
        return 'Deployed ' + short(d.version) + ', slot ' + d.slot + '. Traffic switched.';
      });
    });
    rb.addEventListener('click', function () {
      if (!confirm('Roll back project ' + p.project + ' to the previous version?')) return;
      run('Rolling back…', '/api/rollback', { project: p.project }, function (d) {
        return 'Rolled back: slot ' + d.slot + ', version ' + short(d.version) + '.';
      });
    });
    c.appendChild(f);

    if (p.history && p.history.length) {
      var hist = el('div', 'hist');
      p.history.slice().reverse().forEach(function (x) { hist.appendChild(el('div', null, x.time + '  ' + x.event + '  ' + short(x.version) + '  slot ' + x.slot)); });
      c.appendChild(hist);
    }
    return c;
  }

  function setBusy(b) { busy = b; document.querySelectorAll('button').forEach(function (x) { x.disabled = b; }); }

  function run(wait, path, body, okText, reload) {
    if (busy) return;
    setBusy(true); msg('ok', wait);
    api(path, body).then(function (r) {
      if (r.ok) { msg('ok', okText(r.data)); }
      else { msg('err', r.error.message + (r.error.hint ? '\n' + r.error.hint : '')); }
    }).catch(function (e) { msg('err', 'No connection: ' + e); }).then(function () { setBusy(false); (reload || load)(); });
  }

  function fwCard(st) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'meta', (st.active ? 'On' : 'Off') + ', SSH port: ' + st.ssh_port));
    if (!st.active) {
      var eb = el('button', 'primary', 'Enable');
      eb.addEventListener('click', function () {
        if (!confirm('Enable the firewall? SSH (port ' + st.ssh_port + '), 80 and 443 will be open, other incoming traffic will be closed.')) return;
        run('Enabling…', '/api/firewall/enable', {}, function () { return 'Firewall enabled.'; }, loadFw);
      });
      c.appendChild(eb);
    }
    var t = el('table'), h = el('tr');
    ['Port', 'Action', 'From', ''].forEach(function (x) { h.appendChild(el('th', null, x)); });
    t.appendChild(h);
    (st.rules || []).forEach(function (r) {
      var row = el('tr');
      row.appendChild(el('td', null, r.port ? r.port + (r.proto ? '/' + r.proto : '') : r.raw));
      row.appendChild(el('td', null, r.action));
      row.appendChild(el('td', null, r.from));
      var cell = el('td');
      if (r.protected) cell.appendChild(el('span', 'tag', 'protected'));
      else if (r.port) {
        var del = el('button', null, 'Close');
        del.addEventListener('click', function () {
          if (!confirm('Close ' + r.port + '/' + r.proto + (r.from !== 'any' ? ' for ' + r.from : '') + '?')) return;
          run('Closing…', '/api/firewall/remove', { port: r.port, proto: r.proto, from: r.from === 'any' ? '' : r.from, action: r.action }, function () { return 'Port ' + r.port + ' closed.'; }, loadFw);
        });
        cell.appendChild(del);
      }
      row.appendChild(cell);
      t.appendChild(row);
    });
    c.appendChild(t);
    var f = el('form'), port = el('input', 'num'), proto = el('select'), src = el('input', 'src'), add = el('button', 'primary', 'Open port');
    port.type = 'text'; port.placeholder = 'port'; port.maxLength = 5; port.inputMode = 'numeric'; port.autocomplete = 'off';
    ['tcp', 'udp'].forEach(function (x) { var o = el('option', null, x); o.value = x; proto.appendChild(o); });
    src.type = 'text'; src.placeholder = 'only from this address (optional)'; src.autocomplete = 'off'; src.spellcheck = false;
    add.type = 'submit';
    f.appendChild(port); f.appendChild(proto); f.appendChild(src); f.appendChild(add);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var n = parseInt(port.value, 10);
      if (!(n >= 1 && n <= 65535)) { msg('err', 'Port: a number from 1 to 65535.'); return; }
      var from = src.value.trim();
      if (!confirm('Open ' + n + '/' + proto.value + (from ? ' for ' + from : ' for everyone') + '?')) return;
      run('Opening…', '/api/firewall/allow', { port: n, proto: proto.value, from: from }, function () { return 'Port ' + n + '/' + proto.value + ' opened.'; }, loadFw);
    });
    c.appendChild(f);
    return c;
  }

  function loadFw() {
    api('/api/firewall').then(function (r) {
      var box = document.getElementById('fw');
      box.textContent = '';
      if (!r.ok) { box.appendChild(el('p', r.error.code === 'permission_denied' ? 'empty' : 'down', r.error.message)); return; }
      box.appendChild(fwCard(r.data));
      if (busy) setBusy(true);
    }).catch(function (e) { document.getElementById('fw').textContent = 'No connection: ' + e; });
  }

  function pluginCard(p) {
    var c = el('div', 'card');
    c.appendChild(el('h2', null, p.name));
    c.appendChild(el('div', 'meta', p.description + ' · ' + (p.kind === 'builtin' ? 'built-in' : 'external') + (p.requires && p.requires.length ? ' · needs packages: ' + p.requires.join(', ') : '')));
    var out = el('pre', 'out'); out.style.display = 'none';
    (p.commands || []).forEach(function (cm) {
      var row = el('div', 'cmd');
      row.appendChild(el('code', null, 'lite ' + p.name + ' ' + cm.name + (cm.args ? ' ' + cm.args : '')));
      row.appendChild(el('span', 'help', ' — ' + cm.help));
      var f = el('form'), inp = el('input'), go = el('button', cm.confirm ? null : 'primary', 'Run');
      if (cm.args) { inp.type = 'text'; inp.placeholder = cm.args; inp.autocomplete = 'off'; inp.spellcheck = false; f.appendChild(inp); }
      go.type = 'submit'; f.appendChild(go);
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var args = cm.args ? inp.value.trim().split(/\s+/).filter(Boolean) : [];
        if (cm.args && cm.args.indexOf('…') < 0 && args.length !== cm.args.split(/\s+/).length) { msg('err', 'Required: ' + cm.args); return; }
        if (cm.args && !args.length) { msg('err', 'Required: ' + cm.args); return; }
        if (cm.confirm && !confirm('Run: lite ' + p.name + ' ' + cm.name + ' ' + args.join(' ') + '?')) return;
        if (busy) return;
        setBusy(true); msg('ok', 'Running…');
        api('/api/plugin', { plugin: p.name, command: cm.name, args: args }).then(function (r) {
          if (r.ok) {
            clearMsg();
            out.style.display = 'block';
            out.textContent = pluginText(r.data);
          } else { msg('err', r.error.message + (r.error.hint ? '\n' + r.error.hint : '')); }
        }).catch(function (e) { msg('err', 'No connection: ' + e); }).then(function () { setBusy(false); });
      });
      row.appendChild(f);
      c.appendChild(row);
    });
    c.appendChild(out);
    return c;
  }
  function pluginText(d) {
    if (!d) return 'Done.';
    if (Array.isArray(d.packages) && !d.action) return d.packages.length ? d.packages.map(function (x) { return x.name + '  ' + x.version + '  ' + x.installed_at; }).join('\n') : 'No packages have been installed through lite yet.';
    if (d.packages && d.action) return 'Done: ' + d.action + ' ' + d.packages.join(', ');
    if ('installed' in d) return d.name + ': ' + (d.installed ? 'installed, version ' + d.version + (d.by_lite ? ' (through lite)' : ' (not through lite)') : 'not installed');
    if (d.output !== undefined) return d.output;
    return JSON.stringify(d, null, 2);
  }
  function loadPlugins() {
    api('/api/plugins').then(function (r) {
      var box = document.getElementById('pl');
      box.textContent = '';
      if (!r.ok) { box.appendChild(el('p', r.error.code === 'permission_denied' ? 'empty' : 'down', r.error.message)); return; }
      (r.data.plugins || []).forEach(function (p) { box.appendChild(pluginCard(p)); });
      (r.data.load_errors || []).forEach(function (m) { box.appendChild(el('p', 'down', m)); });
    }).catch(function (e) { document.getElementById('pl').textContent = 'No connection: ' + e; });
  }
  function verify() {
    var box = document.getElementById('vfout');
    if (busy) return;
    setBusy(true); box.textContent = 'Checking…';
    api('/api/verify').then(function (r) {
      box.textContent = '';
      if (!r.data) { box.appendChild(el('p', 'down', r.error.message)); return; }
      var t = el('table');
      r.data.findings.forEach(function (f) {
        var row = el('tr');
        row.appendChild(el('td', f.level === 'ok' ? 'up' : (f.level === 'warn' ? 'warn' : 'down'), f.level === 'ok' ? 'ok' : (f.level === 'warn' ? 'warning' : 'error')));
        row.appendChild(el('td', null, f.plugin + '/' + f.check));
        row.appendChild(el('td', null, f.message + (f.fix && f.level !== 'ok' ? '  →  ' + f.fix : '')));
        t.appendChild(row);
      });
      box.appendChild(t);
      box.appendChild(el('div', 'meta', 'Total: ok ' + r.data.ok + ', warnings ' + r.data.warnings + ', errors ' + r.data.failures));
      if (r.data.warnings + r.data.failures > 0) {
        var fx = el('button', null, 'Fix what can be fixed automatically');
        fx.addEventListener('click', function () {
          if (!confirm('Run the safe fixes from lite fix (SSH and update settings, fail2ban, sysctl, backup timers, installing the plugins projects need)? The firewall, users and keys are not touched.')) return;
          run('Fixing…', '/api/fix', {}, function (d) {
            return d.applied.length ? 'Done: ' + d.applied.join('; ') + (d.manual.length ? '\nManual: ' + d.manual.join('; ') : '') : 'Nothing to fix automatically.' + (d.manual.length ? '\nManual: ' + d.manual.join('; ') : '');
          }, verify);
        });
        box.appendChild(fx);
      }
    }).catch(function (e) { box.textContent = 'No connection: ' + e; }).then(function () { setBusy(false); });
  }
  document.getElementById('vfgo').addEventListener('click', verify);

  function load() {
    api('/api/status').then(function (r) {
      var list = document.getElementById('list');
      list.textContent = '';
      if (!r.ok) {
        if (r.error.code === 'permission_denied') { list.appendChild(el('p', 'empty', r.error.message)); return; }
        if (r.error.code === 'project_not_found') { list.appendChild(el('p', 'empty', 'No projects yet. Create one: lite project create.')); return; }
        list.appendChild(el('p', 'down', r.error.message)); return;
      }
      var ps = ('projects' in r.data) ? (r.data.projects || []) : [r.data];
      if (!ps.length) { list.appendChild(el('p', 'empty', 'No projects yet.')); return; }
      ps.forEach(function (p) { list.appendChild(card(p)); });
      if (busy) setBusy(true);
    }).catch(function (e) { document.getElementById('list').textContent = 'No connection: ' + e; });
  }


  // ---- New project: the form builds the description, secrets are encrypted on this computer before sending ----
  function newProject() {
    var root = document.getElementById('np'), box = el('div', 'card np');
    root.appendChild(box);
    var services = [], sites = [], lastHash = '';

    function field(parent, label, ph, val) {
      var d = el('div'); d.appendChild(el('label', null, label));
      var i = el('input'); i.type = 'text'; i.placeholder = ph || ''; i.autocomplete = 'off'; i.spellcheck = false; if (val) i.value = val;
      d.appendChild(i); parent.appendChild(d); return i;
    }
    function area(parent, label, ph) {
      var d = el('div'); d.appendChild(el('label', null, label));
      var t = el('textarea'); t.placeholder = ph || ''; t.spellcheck = false; d.appendChild(t); parent.appendChild(d); return t;
    }
    function select(parent, label, opts) {
      var d = el('div'); d.appendChild(el('label', null, label));
      var s = el('select'); opts.forEach(function (o) { var x = el('option', null, o[1]); x.value = o[0]; s.appendChild(x); });
      d.appendChild(s); parent.appendChild(d); return s;
    }
    function check(parent, label) {
      var d = el('label', 'inline'), c = el('input'); c.type = 'checkbox'; d.appendChild(c); d.appendChild(document.createTextNode(label)); parent.appendChild(d); return c;
    }
    function row(parent) { var r = el('div', 'row'); parent.appendChild(r); return r; }
    function sub(parent, title) { var b = el('div', 'box'); b.appendChild(el('div', 'meta', title)); parent.appendChild(b); return b; }

    var top = row(box), name = field(top, 'Project name (Latin letters, digits, "-")', 'shop'), desc = field(top, 'Description (optional)', '');

    var dbOn = check(box, 'PostgreSQL database'), dbBox = sub(box, 'Database'), dbRow = row(dbBox);
    var dbServer = field(dbRow, 'Server (empty: this one; otherwise a name from lite server add)', ''), dbPort = field(dbRow, 'Port (for another server)', '5432'),
      dbFmt = select(dbRow, 'Connection string format', [['url', 'url'], ['npgsql', 'npgsql (.NET)'], ['libpq', 'libpq']]),
      dbPass = field(dbBox, 'Role password (only for a database on another server)', '');
    dbPass.type = 'password'; dbBox.style.display = 'none';
    dbOn.addEventListener('change', function () { dbBox.style.display = dbOn.checked ? '' : 'none'; });

    var regOn = check(box, 'Private image registry'), regBox = sub(box, 'Registry'), regRow = row(regBox);
    var regHost = field(regRow, 'Registry host', 'ghcr.io'), regUser = field(regRow, 'User', ''), regTok = field(regBox, 'Read-only token', '');
    regTok.type = 'password'; regBox.style.display = 'none';
    regOn.addEventListener('change', function () { regBox.style.display = regOn.checked ? '' : 'none'; });

    box.appendChild(el('h3', null, 'Components'));
    var svcBox = el('div'); box.appendChild(svcBox);
    var addSvc = el('button', null, '+ Component'); addSvc.type = 'button'; box.appendChild(addSvc);
    box.appendChild(el('h3', null, 'Sites'));
    var siteBox = el('div'); box.appendChild(siteBox);
    var addSite = el('button', null, '+ Site'); addSite.type = 'button'; box.appendChild(addSite);
    var keyArea = area(box, 'CI key (ssh-ed25519, optional)', 'ssh-ed25519 AAAA… github-actions');

    function addService() {
      var b = sub(svcBox, 'Component'), s = {};
      var r1 = row(b);
      s.name = field(r1, 'Name', 'api');
      s.kind = select(r1, 'How it runs', [['quadlet', 'container (podman)'], ['unit', 'process on the server (systemd)']]);
      var cont = el('div'), unit = el('div'); b.appendChild(cont); b.appendChild(unit); unit.style.display = 'none';
      var rc = row(cont); s.image = field(rc, 'Image without a tag', 'ghcr.io/owner/app'); s.cport = field(rc, 'Application port in the container', '8080');
      var ru = row(unit); s.exec = field(ru, 'Command (arguments separated by spaces; path from the release directory)', './bin/app');
      s.rurl = field(ru, 'tar.gz archive URL (https, {sha} is substituted)', 'https://example.com/app-{sha}.tar.gz');
      s.rkey = field(unit, 'minisign public key that CI signs the archive with (signature: archive URL + .minisig)', 'RWQ…');
      s.rtok = field(unit, 'Download token (optional)', ''); s.rtok.type = 'password';
      var r2 = row(b); s.mem = field(r2, 'Memory', '512m'); s.health = field(r2, 'Readiness check path', '/health/ready');
      s.env = area(b, 'Variables (one per line: NAME=value)', 'ASPNETCORE_ENVIRONMENT=Production');
      s.sec = area(b, 'Secrets (one per line: NAME=value; stored on the server, not part of the description)', 'Auth__SessionSecret=…');
      s.dbenv = field(b, 'Variable with the database connection string (optional)', 'ConnectionStrings__Default');
      var del = el('button', null, 'Remove component'); del.type = 'button'; b.appendChild(del);
      s.box = b;
      s.kind.addEventListener('change', function () { var u = s.kind.value === 'unit'; cont.style.display = u ? 'none' : ''; unit.style.display = u ? '' : 'none'; });
      del.addEventListener('click', function () { b.remove(); services = services.filter(function (x) { return x !== s; }); });
      services.push(s);
    }
    function addSiteBox() {
      var b = sub(siteBox, 'Site'), s = {}, r1 = row(b);
      s.name = field(r1, 'Name', 'main'); s.host = field(r1, 'Domain', 'shop.example.com'); s.svc = field(r1, 'Component', 'api');
      var r2 = row(b);
      s.proxy = select(r2, 'Trusted proxy', [['none', 'none'], ['cloudflare', 'Cloudflare']]); s.body = field(r2, 'Maximum request body', '5MB');
      var del = el('button', null, 'Remove site'); del.type = 'button'; b.appendChild(del);
      del.addEventListener('click', function () { b.remove(); sites = sites.filter(function (x) { return x !== s; }); });
      sites.push(s);
    }
    addSvc.addEventListener('click', addService); addSite.addEventListener('click', addSiteBox);
    addService(); addSiteBox();

    function lines(text) { return text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
    function pair(l) { var i = l.indexOf('='); return i < 1 ? null : [l.slice(0, i).trim(), l.slice(i + 1)]; }
    function secretName(parts) { var n = parts.join('_').toLowerCase().replace(/[^a-z0-9_]/g, '_'); return /^[a-z]/.test(n) ? n : 's_' + n; }
    function opt(o, k, v) { if (v !== '' && v !== undefined && v !== null) o[k] = v; }

    // Builds the project description and the secret values; returns a string if the form has an error.
    function build() {
      var p = { schema: 'lite-deploy/project/v2', name: name.value.trim() }, sec = {}, errs = [];
      opt(p, 'description', desc.value.trim());
      if (dbOn.checked) {
        p.database = { engine: 'postgres', connection_format: dbFmt.value };
        if (dbServer.value.trim()) {
          p.database.server = dbServer.value.trim();
          if (dbPort.value.trim()) p.database.port = parseInt(dbPort.value, 10);
          p.database.password_secret = 'secret://db_password'; sec.db_password = dbPass.value;
        }
      }
      if (regOn.checked) {
        p.registry = { host: regHost.value.trim(), username: regUser.value.trim(), token_secret: 'secret://registry_token' }; sec.registry_token = regTok.value;
      }
      p.services = {};
      services.forEach(function (s) {
        var n = s.name.value.trim(), o = {};
        if (s.kind.value === 'unit') {
          o.kind = 'unit'; o.exec = s.exec.value.trim().split(/\s+/).filter(Boolean);
          o.release = { url: s.rurl.value.trim(), minisign_key: s.rkey.value.trim() };
          if (s.rtok.value) { var rn = secretName([n, 'release_token']); o.release.token_secret = 'secret://' + rn; sec[rn] = s.rtok.value; }
        } else {
          o.image = s.image.value.trim(); o.container_port = parseInt(s.cport.value, 10) || 0;
        }
        var lim = {}; opt(lim, 'memory', s.mem.value.trim()); if (Object.keys(lim).length) o.limits = lim;
        if (s.health.value.trim()) o.health = { path: s.health.value.trim() };
        var env = {}; lines(s.env.value).forEach(function (l) { var kv = pair(l); if (kv) env[kv[0]] = kv[1]; else errs.push('Variable "' + l + '": NAME=value is required'); });
        if (Object.keys(env).length) o.env = env;
        var sc = {}; lines(s.sec.value).forEach(function (l) { var kv = pair(l); if (kv) { var sn = secretName([n, kv[0]]); sc[kv[0]] = 'secret://' + sn; sec[sn] = kv[1]; } else errs.push('Secret "' + l.split('=')[0] + '": NAME=value is required'); });
        if (Object.keys(sc).length) o.secrets = sc;
        opt(o, 'database_env', s.dbenv.value.trim());
        p.services[n] = o;
      });
      p.sites = sites.map(function (s) {
        var o = { name: s.name.value.trim(), host: s.host.value.trim(), service: s.svc.value.trim(), publish: 'tunnel', trusted_proxy: s.proxy.value };
        opt(o, 'max_body', s.body.value.trim()); return o;
      });
      if (keyArea.value.trim()) p.deploy_key = { public_key: keyArea.value.trim() };
      return errs.length ? errs.join('\n') : { project: p, secrets: sec };
    }

    var go = el('button', 'primary', 'Preview plan'), create = el('button', null, 'Create project'), out = el('div');
    go.type = 'button'; create.type = 'button'; create.disabled = true;
    var btns = el('div', 'row'); btns.style.marginTop = '14px'; btns.appendChild(go); btns.appendChild(create); box.appendChild(btns); box.appendChild(out);

    function show(r) {
      out.textContent = '';
      if (!r.ok) {
        out.appendChild(el('p', 'down', r.error.message + (r.error.hint ? '\n' + r.error.hint : '')));
        (r.error.details || []).forEach(function (d) { out.appendChild(el('div', 'warn', d.path + ': ' + d.message)); });
        return false;
      }
      var t = el('table'), h = el('tr');
      ['Step', 'Action', 'What will happen'].forEach(function (x) { h.appendChild(el('th', null, x)); }); t.appendChild(h);
      (r.data.steps || []).forEach(function (s) {
        var tr = el('tr'); tr.appendChild(el('td', null, s.id)); tr.appendChild(el('td', null, s.action)); tr.appendChild(el('td', s.state === 'failed' ? 'down' : null, (s.state || '') + (s.detail ? '  ' + s.detail : '') + (s.error ? '  ' + s.error : ''))); t.appendChild(tr);
      });
      out.appendChild(t);
      return true;
    }
    function send(path, wait, done) {
      if (busy) return;
      var b = build();
      if (typeof b === 'string') { msg('err', b); return; }
      var body = { project: b.project, secrets: b.secrets };
      if (path.indexOf('create') >= 0 && lastHash) body.expect_project_hash = lastHash;
      setBusy(true); msg('ok', wait);
      api(path, body).then(function (r) { done(r, show(r)); }).catch(function (e) { msg('err', 'No connection: ' + e); }).then(function () { setBusy(false); create.disabled = !lastHash; });
    }
    go.addEventListener('click', function () {
      lastHash = '';
      send('/api/project/preview', 'Building the plan…', function (r, ok) {
        if (ok) { lastHash = r.data.project_hash; msg('ok', 'The plan is built, nothing on the server has changed. Review the steps, then create the project.'); } else { clearMsg(); }
      });
    });
    create.addEventListener('click', function () {
      if (!lastHash || !confirm('Create project ' + name.value.trim() + ' on the server using the plan shown?')) return;
      send('/api/project/create', 'Creating the project, this may take a few minutes…', function (r, ok) {
        if (ok) { msg('ok', 'Project created. Deploy a version with the "Deploy" button on the project card.'); lastHash = ''; load(); } else { clearMsg(); }
      });
    });
    [name, desc, dbServer, dbPort, dbPass, regHost, regUser, regTok, keyArea].forEach(function (x) { x.addEventListener('input', function () { lastHash = ''; create.disabled = true; }); });
  }

  newProject();
  api('/api/info').then(function (i) { document.getElementById('srv').textContent = i.host ? 'server: ' + i.host : 'this computer'; }).catch(function () {});
  load(); loadFw(); loadPlugins();
  setInterval(function () { if (!busy && document.activeElement.tagName !== 'INPUT') { load(); loadFw(); } }, 10000);
})();
</script>
</body>
</html>
