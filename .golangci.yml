version: "2"
linters:
  default: standard
  enable:
    - staticcheck
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # lite-deploy по назначению читает файлы по путям пользователя и запускает команды через host.Runner
      - path: internal/(host|cli)/
        text: "G304|G204"
      - path: _test\.go
        linters: [gosec]
run:
  timeout: 5m
