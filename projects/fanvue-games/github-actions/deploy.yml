# Тесты, сборка образов и деплой на боевой сервер (blue-green).
#   push в main        : тесты, образы, деплой автоматически
#   кнопка (Run workflow) из ветки release : то же самое для этой ветки
# Откат: workflow "rollback". Деплой идёт по SSH, секреты лежат в окружении production.
# Сторонних действий нет: только actions/checkout (закреплён по хэшу коммита), docker и dotnet с раннера.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# выкатки идут по очереди и не прерывают друг друга
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    # кнопка работает только из main и release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        env:
          FANVUE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=ci;Password=ci
        run: dotnet test api/FanVue.Games.Tests

  images:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=ghcr.io/${owner}/fanvue-games-api" >> "$GITHUB_ENV"
          echo "ADMIN_IMAGE=ghcr.io/${owner}/fanvue-games-admin" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # метка source связывает пакет с репозиторием: пакет приватный и наследует его права
      - name: Build service image
        run: >
          docker build -f api/FanVue.Games/Dockerfile
          --build-arg "GIT_SHA=${GITHUB_SHA}"
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "${API_IMAGE}:${GITHUB_SHA}" -t "${API_IMAGE}:latest" .

      - name: Build admin image
        run: >
          docker build -f api/FanVue.Games.Admin/Dockerfile
          --build-arg "GIT_SHA=${GITHUB_SHA}"
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "${ADMIN_IMAGE}:${GITHUB_SHA}" -t "${ADMIN_IMAGE}:latest" .

      - name: Push images
        run: |
          for image in "$API_IMAGE" "$ADMIN_IMAGE"; do
            docker push "${image}:${GITHUB_SHA}"
            docker push "${image}:latest"
          done

  deploy:
    needs: images
    # пока сервер не подготовлен, выкатка выключена: включается переменной репозитория DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # ключ ограничен на сервере: он умеет только эту команду, "rollback" и "status"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${GITHUB_SHA}"
