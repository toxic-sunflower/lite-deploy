name: pages

# Отдаёт site/install.sh по адресу https://lite-deploy.prozorov.me/install.sh
on:
  push:
    branches: [main]
    paths: ["site/**", "*.md", "minisign.pub"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Ключ в установщике совпадает с minisign.pub
        run: |
          key=$(sed -n '2p' minisign.pub)
          grep -qF "MINISIGN_PUBKEY=\"$key\"" site/install.sh
      - name: Сборка сайта из Markdown
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q markdown==3.7
          "$RUNNER_TEMP/venv/bin/python" site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
