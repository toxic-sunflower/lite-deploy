name: pages

# Serves site/install.sh (the bootstrap) at https://lite-deploy.prozorov.me/install.sh, and site/liteup, site/lite-ui, site/lite-ui.ps1
on:
  push:
    branches: [main]
    paths: ["site/**", "*.md", "minisign.pub"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: The key in liteup matches minisign.pub
        run: |
          key=$(sed -n '2p' minisign.pub)
          grep -qF "MINISIGN_PUBKEY=\"$key\"" site/liteup
      - name: Build the site from Markdown
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q markdown==3.7
          "$RUNNER_TEMP/venv/bin/python" site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
