name: release

# Release on a vX.Y.Z tag: linux, macOS and Windows binaries, the liteup scripts, SHA256SUMS and its minisign signature.
# Repository secret: MINISIGN_KEY (the content of minisign.key, a key without a password).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Build
        run: |
          mkdir dist
          # the product (the server side): Linux only
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/toxic-sunflower/lite-deploy/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o dist/lite-deploy-linux-$arch ./cmd/lite-deploy
          done
          # the interface (your computer): a separate small program, never installed on the server
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o dist/lite-ui-$os-$arch$ext ./cmd/lite-ui
          done
          cp site/liteup dist/liteup
          cp site/lite-ui dist/lite-ui
          cp site/lite-ui.ps1 dist/lite-ui.ps1
          (cd dist && sha256sum lite-deploy-* lite-ui-* liteup lite-ui lite-ui.ps1 > SHA256SUMS)
      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -Vm dist/SHA256SUMS -p minisign.pub
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
