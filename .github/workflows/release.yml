name: release

# Релиз по тегу vX.Y.Z: бинарники linux amd64/arm64, SHA256SUMS и его подпись minisign.
# Секреты репозитория: MINISIGN_KEY (содержимое minisign.key), MINISIGN_PASSWORD (пароль ключа).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Тесты
        run: go test -race -count=1 ./...
      - name: Сборка
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/toxic-sunflower/lite-deploy/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o dist/lite-deploy-linux-$arch ./cmd/lite-deploy
          done
          (cd dist && sha256sum lite-deploy-linux-* > SHA256SUMS)
      - name: Подпись SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -Vm dist/SHA256SUMS -p minisign.pub
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
